name: Prepare web lockfile (temporary)

on:
  push:
    branches: [feature/supabase-auth-profile-integration]

permissions:
  contents: write

jobs:
  create-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate deterministic lockfile without running install scripts
        run: npm install --package-lock-only --ignore-scripts --prefix web
      - name: Commit lockfile to this feature branch only
        run: |
          git add web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already committed."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(web): lock Supabase and React dependencies'
          git push origin HEAD:feature/supabase-auth-profile-integration
